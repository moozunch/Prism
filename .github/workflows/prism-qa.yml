name: Prism QA

on:
  pull_request:
  push:
    branches:
      - 'qa/release-readiness-remediation-*'
    paths-ignore:
      - 'docs/qa/runs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build assets
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --no-interaction
          npm ci
          npm run build
      - name: Run Pest against in-memory SQLite
        run: scripts/qa/run.sh "$RUNNER_TEMP/prism-qa"
      - name: Audit locked dependencies
        run: |
          npm_status=0
          composer_status=0
          npm audit --json > "$RUNNER_TEMP/prism-qa/npm-audit.json" || npm_status=$?
          composer audit --locked --format=json > "$RUNNER_TEMP/prism-qa/composer-audit.json" || composer_status=$?
          if [ "$npm_status" -ne 0 ] || [ "$composer_status" -ne 0 ]; then
            echo "::error title=Dependency audit::npm exit $npm_status, Composer exit $composer_status"
            if [ "$npm_status" -ne 0 ]; then
              jq -r '(.vulnerabilities // {}) | to_entries[] | "::error title=npm audit::\(.key) \(.value.severity)"' \
                "$RUNNER_TEMP/prism-qa/npm-audit.json"
            fi
            if [ "$composer_status" -ne 0 ]; then
              jq -r '(.advisories // {}) | to_entries[] | .key as $pkg | .value[] | "::error title=Composer advisory::\($pkg) \(.advisoryId) \(.severity)"' \
                "$RUNNER_TEMP/prism-qa/composer-audit.json"
              jq -r '(.abandoned // {}) | keys[] | "::error title=Composer abandoned package::\(.)"' \
                "$RUNNER_TEMP/prism-qa/composer-audit.json"
            fi
          fi
          {
            printf '### Dependency audit results\n\n- npm exit %s\n- Composer exit %s\n' "$npm_status" "$composer_status"
            jq -r '(.metadata.vulnerabilities // {}) | to_entries[] | "- npm \(.key): \(.value)"' \
              "$RUNNER_TEMP/prism-qa/npm-audit.json"
            jq -r '(.advisories // {}) | to_entries[] | .key as $pkg | .value[] | "- Composer \($pkg) \(.advisoryId) \(.severity)"' \
              "$RUNNER_TEMP/prism-qa/composer-audit.json"
            jq -r '(.abandoned // {}) | keys[] | "- Composer abandoned: \(.)"' \
              "$RUNNER_TEMP/prism-qa/composer-audit.json"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$npm_status" -eq 0 && test "$composer_status" -eq 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-pest-results
          path: ${{ runner.temp }}/prism-qa/
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --no-interaction
          npm ci
          npm run build
          npm install --prefix "$RUNNER_TEMP/playwright" --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture isolated browser evidence
        run: |
          export PRISM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/playwright/node_modules/playwright"
          scripts/qa/browser.sh "$RUNNER_TEMP/prism-browser"
      - name: Upload browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-browser-evidence
          path: ${{ runner.temp }}/prism-browser/
          if-no-files-found: warn
